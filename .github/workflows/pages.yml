# 매일 KOBIS 데이터를 다시 수집해 커밋하고, dashboard/index.html을 GitHub Pages로 배포한다.
# 수집·검증이 실패하면 커밋·배포하지 않고 멈춘다(이전 사이트가 그대로 남음).
name: Dashboard (collect & deploy)

on:
  schedule:
    - cron: "10 22 * * *"   # 매일 07:10 KST (UTC 22:10)
  workflow_dispatch:
    inputs:
      daily_from:
        description: "일별 데이터 수집 시작일 (YYYY-MM-DD, 비워 두면 최근 7일만)"
        required: false
        default: ""
      daily_to:
        description: "일별 데이터 수집 종료일 (YYYY-MM-DD, 최대 731일, 어제까지)"
        required: false
        default: ""
  push:
    branches: [main]
    paths: ["dashboard/**", ".github/workflows/pages.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4

      - name: Collect from KOBIS
        if: github.event_name != 'push'
        run: |
          python3 scrape.py
          python3 totals.py
          python3 nation.py

      - name: Collect daily box office
        if: github.event_name != 'push'
        env:
          DAILY_FROM: ${{ inputs.daily_from }}
          DAILY_TO: ${{ inputs.daily_to }}
        run: |
          if [ -n "$DAILY_FROM" ] || [ -n "$DAILY_TO" ]; then
            python3 daily.py "$DAILY_FROM" "$DAILY_TO"
          else
            python3 daily.py --recent
          fi

      - name: Validate data
        run: |
          python3 - <<'EOF'
          import json, sys
          d = json.load(open("kobis.json"))
          errs = []
          if len(d["alltime"]) < 100: errs.append(f"alltime rows {len(d['alltime'])}")
          for y in d["years"]:
              if len(d["yearly"][str(y)]) < 20: errs.append(f"{y} rows {len(d['yearly'][str(y)])}")
          if [t["y"] for t in d["totals"]] != d["years"]: errs.append("totals years mismatch")
          if d.get("nationMissing", 1) != 0: errs.append(f"nationMissing {d.get('nationMissing')}")
          dy = json.load(open("daily.json"))
          if not dy.get("ranges") or not dy.get("movies"): errs.append("daily.json empty")
          if errs:
              print("validation failed:", errs); sys.exit(1)
          print("ok", d["asOf"], "rejected", d["rejectedCount"])
          EOF

      - name: Build page
        run: python3 build.py

      - name: Commit updated data
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kobis.json daily.json index.html
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Update KOBIS data ($(python3 -c 'import json;print(json.load(open("kobis.json"))["asOf"])'))"
          git push

      - name: Prepare site
        run: mkdir -p ../_site && cp index.html daily.json ../_site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
